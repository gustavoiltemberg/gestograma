<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestograma Digital</title>
    
    <!-- Bibliotecas externas (Flatpickr) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">

    <!-- SEU ARQUIVO CSS SEPARADO -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="controles">
        <label for="dataDum"><strong>Data da Última Menstruação (DUM):</strong></label><br>
        <!-- O input já começa com a data de hoje via JS -->
        <input type="text" id="dataDum">
        <p style="font-size: 0.8em; color: #666; margin-top: 5px;">(Gire a roda ou escolha a data)</p>
    </div>

    <div class="roda-container" id="rodaContainer">
        <img src="azul.png" alt="Calendário Base" class="img-azul">
        <img src="verde.png" alt="Setas do Gestograma" class="img-verde" id="rodaVerde">
    </div>

    <div class="resultado" id="resultadoTexto"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
    <script src="script.js"></script>
</body>
</html>
